<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Strong Together</title>
<meta name="description" content="A friendly strength, grip, balance and stretching tracker for two.">
<meta name="theme-color" content="#ff7a45">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Strong Together">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff8f1; --card:#ffffff; --ink:#1f2333; --muted:#5b6175; --line:#eadfd3;
  --coral:#ff7a45; --coral-ink:#b8410f; --coral-soft:#ffe6da;
  --teal:#0f9d8a; --teal-soft:#d6f3ee;
  --violet:#7a5af8; --violet-soft:#ebe5ff;
  --sun:#f5a524; --sun-soft:#fff0cf;
  --rose:#e84a7f; --rose-soft:#ffe1ec;
  --ok:#16a34a; --shadow:0 6px 20px rgba(80,50,20,.08);
  --radius:22px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171923; --card:#22252f; --ink:#f4f1ec; --muted:#b6b9c6; --line:#343846;
    --coral-soft:#4a2a1d; --coral-ink:#ffb08c; --teal-soft:#123a35; --violet-soft:#2c2650;
    --sun-soft:#43361a; --rose-soft:#46202f; --shadow:0 6px 20px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#171923; --card:#22252f; --ink:#f4f1ec; --muted:#b6b9c6; --line:#343846;
  --coral-soft:#4a2a1d; --coral-ink:#ffb08c; --teal-soft:#123a35; --violet-soft:#2c2650;
  --sun-soft:#43361a; --rose-soft:#46202f; --shadow:0 6px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{font-size:20px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45;font-weight:600}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:var(--coral-ink)}
.wrap{max-width:640px;margin:0 auto;padding-top:max(16px, env(safe-area-inset-top, 0px));padding-bottom:calc(120px + env(safe-area-inset-bottom, 0px));padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
html{-webkit-tap-highlight-color:transparent}
button,a,.chip,label.btn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
:focus-visible{outline:3px solid var(--coral);outline-offset:3px}
.grid2,.grid3{display:grid;grid-template-columns:1fr;gap:0 14px}
.daypick{display:flex;gap:8px;align-items:center;margin:0 0 14px}
.daypick button{flex:1;min-height:52px;border-radius:14px;background:var(--card);border:2px solid var(--line);font-weight:900}
.daypick button[aria-pressed="true"]{border-color:var(--coral);background:var(--coral-soft)}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.quick button{min-height:72px;border-radius:16px;font-weight:900;font-size:.9rem;border:2px solid transparent}
.quick button .e{display:block;font-size:1.5rem}
.share-ico{display:inline-block;vertical-align:-4px;width:22px;height:22px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 14px}
.brand{font-weight:900;font-size:1.35rem;letter-spacing:-.01em}
.brand span{color:var(--coral)}
.gear{width:52px;height:52px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);font-size:1.3rem}
h1{font-size:1.6rem;line-height:1.2;margin:.2rem 0 .3rem;font-weight:900;letter-spacing:-.01em}
h2{font-size:1.2rem;margin:1.4rem 0 .6rem;font-weight:900}
p{margin:.3rem 0 .8rem}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:14px;border:1px solid var(--line)}
/* who picker */
.who{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.who button{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:12px 6px;font-weight:800;min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.who button .e{font-size:1.7rem;line-height:1}
.av{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:900;line-height:1;vertical-align:middle;flex:none;font-size:.62em;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.swatch{aspect-ratio:1;max-width:72px;width:100%;justify-self:center;border-radius:50%;border:4px solid transparent;background-origin:border-box;background-clip:border-box;box-shadow:0 0 0 2px var(--line)}
.swatch[aria-pressed="true"]{border-color:var(--card);background-clip:padding-box;box-shadow:0 0 0 4px var(--ink)}
.who .av{font-size:1.15rem}
.av-e{line-height:1;vertical-align:middle}
.who button[aria-pressed="true"]{border-color:var(--coral);background:var(--coral-soft)}
/* hero */
.hero{background:linear-gradient(135deg,#ff7a45,#ff4f8b);color:#fff;border:0}
.hero h1{color:#fff}
.hero p{color:#fff;opacity:.95}
.pill{display:inline-block;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.25);font-weight:800;font-size:.8rem}
/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:64px;border-radius:18px;font-weight:900;font-size:1.1rem;padding:12px 18px;background:var(--coral);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.teal{background:var(--teal)}
.btn.violet{background:var(--violet)}
.btn.sun{background:var(--sun);color:#3a2600}
.btn.white{background:#fff;color:var(--coral-ink)}
.row{display:flex;gap:10px}
.row>*{flex:1}
/* session tiles */
.tile{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:12px;min-height:96px}
.tile .ic{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-size:2rem;flex:none}
.tile .t{font-weight:900;font-size:1.1rem}
.tile .s{color:var(--muted);font-size:.85rem}
.tile .go{margin-left:auto;font-size:1.4rem;color:var(--muted)}
.tile.done{outline:3px solid var(--ok)}
.tag{display:inline-block;font-size:.72rem;font-weight:900;padding:2px 10px;border-radius:999px;background:var(--sun-soft);color:#7a4b00;margin-left:6px;vertical-align:middle}
:root[data-theme="dark"] .tag{color:#ffd37a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag{color:#ffd37a}}
.c-strength{background:var(--coral-soft)} .c-stretch{background:var(--violet-soft)} .c-grip{background:var(--teal-soft)} .c-walk{background:var(--sun-soft)}
/* goals */
.goals{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.goal{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.goal svg{flex:none}
.goal .n{font-weight:900;font-size:1.05rem}
.goal .l{font-size:.8rem;color:var(--muted);line-height:1.2}
/* walk chips */
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.chip{flex:1 1 calc(25% - 10px);min-width:64px;white-space:nowrap;font-size:.95rem;min-height:58px;border-radius:16px;background:var(--sun-soft);font-weight:900;border:2px solid transparent}
.chip:active{border-color:var(--sun)}
/* garden */
.garden{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.garden .d{background:var(--bg);border-radius:14px;padding:6px 2px;min-height:96px;border:1px solid var(--line)}
.garden .d.today{border:2px solid var(--coral)}
.garden .dn{font-size:.72rem;font-weight:900;color:var(--muted)}
.garden .fl{font-size:1.05rem;line-height:1.15;word-break:break-all}
.qcol{display:flex;flex-direction:column;gap:4px;border-radius:10px;padding:4px 2px}
.qcol.today{background:var(--coral-soft)}
.qcol .dn{margin-bottom:2px}
.patch.empty{background:transparent;border:2px dashed var(--line);box-shadow:none}
.patch{display:block;aspect-ratio:1;border-radius:4px;border:1.5px dashed rgba(255,255,255,.75);box-shadow:0 0 0 1px var(--line)}
.legend .patch{display:inline-block;width:1em;vertical-align:-2px;margin-left:4px}
.p-walk{background:var(--sun);background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.35) 0 3px,transparent 3px 7px),repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 3px,transparent 3px 7px)}
.p-strength{background:var(--coral);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.3) 0 3px,transparent 3px 8px)}
.p-stretch{background:var(--violet);background-image:radial-gradient(rgba(255,255,255,.55) 1.5px,transparent 2px);background-size:7px 7px}
.p-grip{background:linear-gradient(135deg,var(--teal) 50%,#7fd8cb 50%)}
.p-test{background:var(--rose)}
.staff{margin-top:4px}
/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:20}
nav.tabs .in{display:flex;max-width:640px;width:100%}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.78rem;font-weight:900;color:var(--muted);padding:6px 2px;border-radius:14px;min-height:64px}
nav.tabs button .e{font-size:1.5rem;line-height:1.1}
nav.tabs button[aria-current="page"]{color:var(--coral-ink);background:var(--coral-soft)}
/* library */
.filter{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.filter button{white-space:nowrap;padding:10px 16px;border-radius:999px;background:var(--card);border:2px solid var(--line);font-weight:800;min-height:50px}
.filter button[aria-pressed="true"]{border-color:var(--coral);background:var(--coral-soft)}
.ex{display:flex;gap:14px;align-items:flex-start}
.ex .ic{font-size:2rem;width:56px;height:56px;border-radius:16px;display:grid;place-items:center;flex:none}
.ex h3{margin:0;font-size:1.05rem;font-weight:900}
.ex ol{margin:.4rem 0 .4rem;padding-left:1.2rem}
.ex li{margin:.15rem 0}
.vid{display:inline-flex;align-items:center;gap:8px;background:#ff0033;color:#fff;text-decoration:none;font-weight:900;border-radius:14px;padding:10px 16px;min-height:52px;margin-top:6px}
.why{background:var(--violet-soft);border-radius:14px;padding:4px 12px;margin:.6rem 0;font-size:.9rem}
.why summary{cursor:pointer;font-weight:900;min-height:44px;display:flex;align-items:center;list-style:none}
.why summary::-webkit-details-marker{display:none}
.why summary::after{content:'▾';margin-left:auto;transition:transform .2s}
.why[open] summary::after{transform:rotate(180deg)}
.why p{margin:.2rem 0 .6rem}
.why a{display:inline-block;margin-bottom:.6rem}
.weights{margin:.6rem 0}
.wrow{display:flex;align-items:center;gap:10px;margin:8px 0;flex-wrap:wrap}
.wname{font-weight:800;flex:1;min-width:4em}
.weights output{min-width:7.5em;font-size:1rem}
.spk{flex:0 0 auto;width:58px;min-height:52px;padding:0;font-size:1.4rem;margin-left:auto}
.voicebar{margin:4px 0 12px}
.voicebar .btn{min-height:56px;font-size:.95rem}
.coaches{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:600px){ .coaches{grid-template-columns:1fr 1fr} }
.coachcard{min-width:0;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px}
.coachcard[aria-pressed="true"]{border-color:var(--coral);background:var(--coral-soft)}
.coachcard .cn{font-weight:900;font-size:1.05rem}
.coachcard .ca{font-size:.8rem;color:var(--muted)}
.win{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin:6px 0;min-height:60px;font-weight:700}
.win .we{font-size:1.5rem;flex:none}
.win .wt{display:flex;flex-direction:column;font-size:.9rem;min-width:0}
.win .wd{font-size:.75rem;color:var(--ok);font-weight:900}
.win.got{border-color:var(--ok);background:var(--teal-soft)}
.guide .stat b{font-size:1rem;text-align:right}
.guide .stat{margin:3px 0}
.breathe{background:var(--teal-soft);border-radius:14px;padding:10px 12px;font-size:.88rem;margin:.5rem 0}
.safety{background:var(--sun-soft);border-radius:14px;padding:10px 12px;font-size:.88rem;margin:.5rem 0}
/* player */
.player{position:fixed;inset:0;background:var(--bg);z-index:50;overflow-y:auto}
.player{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.player .wrap{padding-bottom:calc(40px + env(safe-area-inset-bottom, 0px))}
.progressbar{height:12px;background:var(--line);border-radius:999px;overflow:hidden;margin:8px 0 18px}
.progressbar i{display:block;height:100%;background:linear-gradient(90deg,var(--coral),var(--rose));border-radius:999px;transition:width .4s}
.bigemoji{font-size:5rem;text-align:center;line-height:1.1;margin:8px 0}
.dose{font-size:1.5rem;font-weight:900;text-align:center;color:var(--coral-ink);margin:.2rem 0 .6rem}
.timer{font-size:3.4rem;font-weight:900;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0}
.steps{font-size:1.05rem}
.steps li{margin:.35rem 0}
.feel{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.feel button{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:14px 4px;font-weight:900;min-height:96px}
.feel button .e{display:block;font-size:2rem}
/* tests */
.counter{width:100%;min-height:200px;border-radius:30px;background:var(--teal);color:#fff;font-size:4rem;font-weight:900;box-shadow:0 6px 0 rgba(0,0,0,.15)}
.counter:active{transform:translateY(3px);box-shadow:none}
.stat{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.stat b{font-size:1.6rem}
.chart{width:100%;height:auto;display:block}
/* badges */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 6px;text-align:center;box-shadow:var(--shadow)}
.badge .e{font-size:2.2rem}
.badge .n{font-weight:900;font-size:.82rem;line-height:1.2}
.badge .w{font-size:.7rem;color:var(--muted)}
.badge.locked{opacity:.38;filter:grayscale(1)}
.level{height:18px;background:var(--line);border-radius:999px;overflow:hidden}
.level i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--coral))}
/* forms */
label.f{display:block;font-weight:800;margin:.6rem 0 .3rem}
input[type=text],input[type=number]{width:100%;font:inherit;font-size:1.1rem;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);min-height:58px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:58px;height:58px;border-radius:16px;background:var(--coral-soft);font-size:1.6rem;font-weight:900}
.stepper output{min-width:2.5ch;text-align:center;font-size:1.4rem;font-weight:900}
.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:14px 22px;border-radius:999px;font-weight:900;z-index:80;box-shadow:var(--shadow);max-width:90vw;text-align:center}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:90}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* High contrast: darker text, stronger outlines, bolder type. Light and dark variants. */
html[data-contrast="high"]{--ink:#000;--muted:#2b2f3c;--line:#4b5061;--coral-ink:#8a2c00;--card:#fff;--bg:#fff7ef}
@media (prefers-color-scheme: dark){ html[data-contrast="high"]:not([data-theme="light"]){--ink:#fff;--muted:#e6e8f0;--line:#c3c7d4;--coral-ink:#ffc4a8;--card:#15171f;--bg:#000} }
html[data-contrast="high"][data-theme="dark"]{--ink:#fff;--muted:#e6e8f0;--line:#c3c7d4;--coral-ink:#ffc4a8;--card:#15171f;--bg:#000}
html[data-contrast="high"] body{font-weight:700}
html[data-contrast="high"] .card,html[data-contrast="high"] .tile,html[data-contrast="high"] .goal,html[data-contrast="high"] .badge{border:2px solid var(--line);box-shadow:none}
html[data-contrast="high"] .btn.ghost,html[data-contrast="high"] .who button,html[data-contrast="high"] .daypick button,html[data-contrast="high"] .filter button,html[data-contrast="high"] .feel button{border-width:3px;border-color:var(--line)}
html[data-contrast="high"] .who button[aria-pressed="true"],html[data-contrast="high"] .daypick button[aria-pressed="true"],html[data-contrast="high"] .filter button[aria-pressed="true"]{border-color:var(--ink);outline:2px solid var(--ink)}
html[data-contrast="high"] .chip,html[data-contrast="high"] .quick button{border:2px solid var(--line)}
html[data-contrast="high"] .btn{box-shadow:0 0 0 2px var(--ink)}
html[data-contrast="high"] .safety,html[data-contrast="high"] .breathe,html[data-contrast="high"] .why{border:2px solid var(--line)}
html[data-contrast="high"] nav.tabs{border-top:3px solid var(--ink)}
html[data-contrast="high"] nav.tabs button{color:var(--ink)}
html[data-contrast="high"] .patch.empty{border-color:var(--muted)}
html[data-contrast="high"] .tag{background:var(--ink);color:var(--card)}
html[data-contrast="high"] :focus-visible{outline:4px solid var(--ink)}
html[data-size="large"]{font-size:23px}
html[data-size="xl"]{font-size:26px}
@media (max-width:380px){html{font-size:18px} html[data-size="large"]{font-size:21px} html[data-size="xl"]{font-size:23px}}
/* iPad and other wide screens: more room, two columns */
@media (min-width:768px){
  .wrap{max-width:940px}
  .grid2{grid-template-columns:1fr 1fr}
  .grid3{grid-template-columns:repeat(3,1fr)}
  .grid3 .tile{flex-direction:column;align-items:flex-start;text-align:left}
  .grid3 .tile .go{display:none}
  .goals{grid-template-columns:repeat(4,1fr)}
  .goal{flex-direction:column;text-align:center}
  .badges{grid-template-columns:repeat(5,1fr)}
  .player .wrap{max-width:720px}
  .chips .chip{min-height:64px}
  .garden .d{min-height:120px}
  .garden .fl{font-size:1.3rem}
}
@media (min-width:1100px){ .wrap{max-width:1040px} }
@media (max-width:600px){ html[data-size] .chip{flex-basis:calc(50% - 5px)} html[data-size] .quick button{font-size:.8rem} }
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div class="wrap" id="app"></div>
<nav class="tabs" aria-label="Main"><div class="in">
  <button data-tab="today"><span class="e">☀️</span>Today</button>
  <button data-tab="moves"><span class="e">🎬</span>Exercises</button>
  <button data-tab="progress"><span class="e">📈</span>Progress</button>
  <button data-tab="trophies"><span class="e">🏆</span>Trophies</button>
</div></nav>
<div id="overlay"></div>

<script>
/* =========================================================
   Strong Together: everything is saved on this device only.
   Edit EXERCISES below to change moves or paste in your own
   favourite video links (set `video` to a full URL).
   ========================================================= */

const yt = q => 'https://www.youtube.com/results?search_query=' + encodeURIComponent(q);

const CATS = {
  strength:{label:'Strength', emoji:'💪', cls:'c-strength'},
  grip:{label:'Grip & Balance', emoji:'✊', cls:'c-grip'},
  stretch:{label:'Mobility & Yoga', emoji:'🧘', cls:'c-stretch'},
  walk:{label:'Walk', emoji:'🚶', cls:'c-walk'}
};

const EXERCISES = {
  march:{name:'Seated Marching', emoji:'🥁', cat:'strength', dose:'1 minute', timer:60,
    steps:['Sit tall near the front of a sturdy chair.','Lift one knee, then the other, like marching.','Swing your arms too. Keep breathing!'],
    tip:'A warm-up. Go at your own pace.', q:'seated marching warm up seniors'},
  chairStand:{name:'Sit-to-Stand', emoji:'🪑', cat:'strength', dose:'2 rounds of 8–12', weighted:true, bodyweight:true,

/* "Why this works": what each move trains and what it's for in daily life.
   General exercise physiology; a source is linked where a specific study is cited. */
const WHY = {
  march:'Raises heart rate and blood flow to the legs before you load them. It also rehearses the hip-flexor lift (iliopsoas) that clears your toes on every walking step.',
  chairStand:'Trains the quadriceps and gluteus maximus in exactly the movement of rising from a chair, a car seat or the toilet. The fast, powerful fibres in these muscles decline fastest with age, and sit-to-stand ability is one of the best everyday markers of independence. It’s why the CDC uses a 30-second chair stand as a screening test.',
  wallPush:'Works the chest (pectoralis major), front of the shoulders and triceps: the pushing muscles you use to get out of bed, up off the floor, or to catch yourself if you stumble. The angle to the wall sets the load, so stepping your feet back is an easy way to progress.',
  curls:'Biceps and forearm muscles for carrying: groceries, a kettle, a grandchild. The forearm work also feeds directly into grip strength.',
  row:'Works the upper back: latissimus dorsi, rhomboids and middle trapezius. These are the pulling muscles for opening heavy doors, starting a lawnmower or pulling yourself up, and they hold the shoulders back against a forward-rounded posture. Most daily life is pushing and reaching forward, so pulling work restores the balance.',
  pelvicTilt:'Moves the lower spine and pelvis through a small range without any load. Gentle movement like this is commonly used to ease back stiffness, because staying still tends to make a stiff back stiffer.',
  counterPush:'The same chest, shoulder and triceps muscles as Wall Push-Ups, but you lift more of your body weight: the lower the surface, the harder it gets. Wall, then counter, then a sturdy table is a simple path to steadily stronger pushing.',
  lateralRaise:'Works the middle of the shoulder (the lateral deltoid), which lifts your arms out to the side and steadies the shoulder joint when you reach: hanging laundry, reaching across the table, lifting things onto a shelf.',
  jarTwist:'Works the forearm rotators (pronators and supinators) and the wrist stabilisers: exactly the twist that opens a jar or turns a stiff tap. Holding further from the weight increases leverage, so you can make it harder without buying anything. A practical extra: a rubber jar gripper or a rubber glove adds a lot of friction.',
  floorPrep:'Getting up from the floor is a skill that can be practised, but practice falls are the thing to avoid. These checks remove the main risks before you start.',
  kneelDown:'The last step of getting up from the floor is rising from kneeling, so practice starts there and works backwards. Physiotherapists teach floor rises in stages like this, starting from the easiest end. It also trains the thighs and hips through a deep bend that daily life rarely asks for.',
  halfKneel:'Half-kneeling is the position you push up from after any fall. Pushing up through the front leg is a single-leg strength move for the quadriceps and glutes, with your hands on the chair helping.',
  floorToChair:{w:'This is the whole sequence the NHS recommends after a fall: roll onto your side, get onto hands and knees, crawl to a sturdy chair, and push up from a half-kneel. Many older adults who fall can’t get up even when they aren’t hurt, and practising the sequence in advance makes it familiar and less frightening.', src:'NHS: Falls', url:'https://www.nhs.uk/conditions/Falls'},
  fallPlan:{w:'Getting up too quickly, or the wrong way, can make an injury worse. That’s why the plan starts with stopping to check, and why some situations call for help rather than getting up.', src:'NHS: Falls', url:'https://www.nhs.uk/conditions/Falls'},
  heelRaise:'The calf muscles (gastrocnemius and soleus) provide most of the push-off in each walking step and make the first, fastest corrections when you sway. Stronger calves mean a longer, steadier stride.',
  sideLeg:'The hip abductors (gluteus medius and minimus) keep your pelvis level whenever you stand on one leg, which happens with every step. When they’re weak the body sways side to side, a common contributor to falls.',
  kneeExt:'Isolates the quadriceps, the main stabiliser of the knee. Strong quads take load off the joint itself and make stairs easier, and isolating them works even on days standing moves feel sore.',
  overhead:'Shoulders (deltoids), triceps and the upper-back muscles that steady the shoulder blade, for reaching up to shelves and cupboards. Optional because pressing overhead raises blood pressure more than most moves.',
  ballSqueeze:{w:'Strengthens the forearm flexors that close the hand. Grip strength is a robust marker of overall muscle strength: in the PURE study of about 140,000 adults in 17 countries, each 5 kg lower grip was associated with about 16% higher all-cause mortality. That’s an association, not proof that training grip alone extends life; it most likely reflects whole-body strength, which is why grip work sits alongside the leg exercises.', src:'Leong et al., Lancet 2015 (PURE)', url:'https://pubmed.ncbi.nlm.nih.gov/25982160/'},
  towelWring:'Combines grip with forearm rotation (pronation and supination): the motion for opening jars, turning keys and door handles.',
  rubberBand:'Trains the finger extensors, the muscles that open the hand. They’re usually neglected, and balancing them against the much stronger closing muscles helps hand comfort and dexterity.',
  bagHold:'A loaded hold builds grip endurance and the core and hip muscles that stop you leaning sideways under a one-sided load: exactly what carrying a shopping bag demands.',
  oneLeg:'Balance is a trainable skill. Practising single-leg stance sharpens the ankle and hip reactions your nervous system uses to correct sway, and every walking step is a brief single-leg stand.',
  heelToe:'Narrowing your base of support makes the three balance systems (inner ear, vision and sensation from the feet) work harder. It’s training for uneven paths, curbs and tight spaces.',
  weightShift:'Teaches controlled movement of your centre of mass over each foot, which is the first phase of every step and of catching yourself.',
  shoulderRoll:'Moves the shoulder blades through elevation, retraction and depression. It counters a forward-rounded posture and eases tension in the neck and upper back.',
  neck:'Lengthens the upper trapezius and scalene muscles, which tighten with reading, sewing and playing. Side bends are used instead of full head circles to avoid compressing the joints at the back of the neck.',
  catCow:'Moves the spine through flexion and extension one segment at a time, keeping the small spinal joints mobile and coordinating movement with breathing. If you have osteoporosis, keep the rounding part small or skip it: forward flexion is the spinal position bone-health guidance usually limits.',
  sideBend:'Lengthens the side of the trunk (obliques, quadratus lumborum and latissimus dorsi). Side bending is the spinal movement most people use least in daily life.',
  twist:'Rotation keeps the upper (thoracic) spine mobile, which you need to look over your shoulder when reversing a car. With osteoporosis, keep twists small and gentle and avoid twisting while lifting.',
  hamstring:'Tight hamstrings shorten your stride and pull on the lower back when you bend. Holding a gentle stretch for 20–30 seconds is the standard way to improve their length.',
  ankle:'Ankle range, especially lifting the foot upward (dorsiflexion), lets your toes clear the ground. Reduced dorsiflexion is linked to tripping.',
  calf:'Calf flexibility allows the ankle to bend for heel strike and a full stride. It complements Heel Raises: one strengthens the calf, this keeps it long.',
  breathing:'Slow belly breathing at about 6 breaths a minute shifts the nervous system toward its “rest and digest” (parasympathetic) mode and helps heart rate settle after exercise.',
  legSwing:'Dynamic mobility: moving the hip through flexion and extension under control increases usable range for walking. Moving stretches like this prepare tissue for activity better than long static holds.',
  armCircle:'Takes the shoulder through its full range, circulating joint fluid and warming up the rotator cuff before heavier arm work.',
  hipCircle:'Moves the hips and lower back in every direction, reducing the stiffness that builds up after sitting.',
  thumbScale:'Thumb opposition, touching the thumb to each fingertip, is the basis of almost every fine hand skill. Practising it maintains coordination of the thumb muscles (the thenar group) and finger independence.',
  fingerLift:'Trains individuated finger control: moving one finger without the others. It declines with age and is precisely what fretting and fingering need.',
  tendonGlide:'Moves the finger flexor tendons through their full glide inside their sheaths. Hand therapists use this sequence for stiffness and arthritis to keep the tendons moving smoothly.',
  wristStretch:'Lengthens the forearm flexors and extensors, which are loaded by sewing, holding a bow or a neck, and gripping. Regular stretching helps prevent overuse irritation such as tennis elbow.',
  chinTuck:'Strengthens the deep neck flexors and brings the head back over the shoulders. When the head drifts forward, the neck and upper-back muscles have to work much harder to hold it up.',
  bladeSqueeze:'Activates the middle trapezius and rhomboids, which hold the shoulder blades back. It counters the rounded shoulders that come from leaning over work.',
  backBend:'Gentle extension counters the hours of forward flexion from sitting, sewing and playing. Extension is generally considered the spine-friendly direction, including for people with low bone density.',

  if(last.length && last[last.length-1].feel==='tough') return `💡 Last Strong Day felt tough. Use the easier options today; consistency matters more than intensity.`;
  return '';
}

const SCIENCE = {
  meal:{h:'Why 25–30 g of protein per meal?', b:'Older muscle shows “anabolic resistance”: it needs a bigger dose of protein at one sitting to switch on muscle building. An expert group (PROT-AGE) puts the threshold at about 25–30 g of protein per meal, with about 2.5–2.8 g of leucine. Spreading protein evenly across meals beats one big dinner.', src:'PROT-AGE, J Am Med Dir Assoc 2013', url:'https://experts.mcmaster.ca/scholarly-works/55421'},

  leucine:{h:'Leucine: the “on switch”', b:'Of all the amino acids, leucine is the main signal that tells muscle to start building. A 2024 review reports that adults over 60 need about 2.8 g of leucine in a meal (around 30 g of protein) to trigger muscle protein synthesis, while younger adults respond to smaller amounts. Dairy, eggs, fish and soy are rich sources.', src:'Review, 2024 (PMC)', url:'https://pmc.ncbi.nlm.nih.gov/articles/PMC11099237'},

  sleep:{h:'Protein before bed', b:'In a trial with men averaging about 72 years old, 40 g of casein (the slow milk protein in cottage cheese and Greek yogurt) before sleep raised overnight muscle building compared with a placebo. Whether that adds up to more muscle over months isn’t proven yet, but a protein snack at bedtime is an easy, low-risk habit.', src:'Kouw et al., J Nutr 2017', url:'https://pubmed.ncbi.nlm.nih.gov/28855419/'},
  creatine:{h:'Creatine isn’t just for athletes', b:'Meta-analyses of trials in older adults find that creatine taken alongside strength training adds roughly 1 kg more lean mass than training alone, with stronger effects on some strength measures. It’s inexpensive, but ask your doctor first, especially with kidney concerns or several medications.', src:'Chilibeck et al., 2017 meta-analysis', url:'https://pmc.ncbi.nlm.nih.gov/articles/PMC5679696'},

/* Personal daily guide from each person's height, weight and age (Settings). */
const lbToKg = lb => lb*0.4536;
function dailyGuide(p){
  if(!p.weightLb) return null;
  const kg=lbToKg(p.weightLb), lo=Math.round(kg*1.0), hi=Math.round(kg*1.2);
  const fibre = p.sex==='f' ? (p.age>=51?21:25) : (p.age>=51?30:38);
  const m=(p.heightIn||0)*0.0254, bmi = m ? kg/(m*m) : null;
  return {lo, hi, fibre, lean: bmi && bmi<23};
}
function guideCard(){
  const rows=S.people.map(p=>{ const g=dailyGuide(p); if(!g) return ''; return `<div style="margin:8px 0">
    <div style="font-weight:900">${avatar(p)} ${esc(p.name)}</div>
    <div class="stat small" style="margin-left:8px"><span>Protein</span><b>${g.lo}–${g.hi} g a day</b></div>
    <div class="stat small" style="margin-left:8px"><span>Fibre</span><b>at least ${g.fibre} g a day</b></div>
    <div class="stat small" style="margin-left:8px"><span>Sodium</span><b>under 1,500 mg ideally</b></div>
    ${g.lean?`<div class="small muted" style="margin:4px 0 0 8px">Lean build: muscle is built from food, so this is a time to eat enough, not less. Protein at every meal.</div>`:''}</div>`; }).join('');
  if(!rows.trim()) return `<div class="card guide"><div class="small" style="font-weight:900;letter-spacing:.04em;text-transform:uppercase">🎯 Your daily guide</div><p class="small" style="margin:.4rem 0 0">Add each person’s height and weight in Settings ⚙️ to see a personal daily guide for protein, fibre and salt. They stay on this device.</p></div>`;
  return `<div class="card guide"><div class="small" style="font-weight:900;letter-spacing:.04em;text-transform:uppercase">🎯 Your daily guide</div>${rows}
    <p class="small muted" style="margin:6px 0 0">From the heights, weights and ages in Settings. Protein: 1.0–1.2 g per kg (PROT-AGE), spread as 25–30 g per meal. Fibre: Health Canada adequate intake. Sodium: American Heart Association ideal limit.</p></div>`;
}

const MALE_HINT = /\b(daniel|arthur|oliver|aaron|fred|evan|nathan|tom|alex|reed|rishi|gordon|lee|ryan|guy|david|mark|male)\b/i;
const isMale = v => MALE_HINT.test(v.name) && !/female/i.test(v.name);
function coach(){ return COACHES.find(c=>c.id===S.voice) || COACHES[0]; }
function voiceList(){ try{ return window.speechSynthesis ? speechSynthesis.getVoices() : []; }catch(e){ return []; } }
try{ if(window.speechSynthesis) speechSynthesis.onvoiceschanged = ()=>{ if($('#voice-list')) openSettings(); }; }catch(e){}
function pickVoice(c){
  const vs=voiceList(); if(!vs.length) return {v:null, exact:false};
  const byName = n => vs.find(v=>v.name.toLowerCase().startsWith(n.toLowerCase()));
  for(const n of c.names){ const v=byName(n); if(v) return {v, exact:true}; }
  const sameLang = vs.filter(v=>v.lang.replace('_','-').toLowerCase()===c.lang.toLowerCase());
  const genderOk = v => c.g==='m' ? isMale(v) : !isMale(v);
  const en = vs.filter(v=>/^en/i.test(v.lang));
  const v = sameLang.find(genderOk) || en.find(genderOk) || sameLang[0] || en[0] || vs[0];
  return {v:v||null, exact:false};
}
const canSpeak = () => !!(window.speechSynthesis && window.SpeechSynthesisUtterance);
function say(text, {force=false, queue=false}={}){
  if(!canSpeak() || (!S.speak && !force)) return;
  try{
    if(!queue) speechSynthesis.cancel();
    const c=coach(), {v,exact}=pickVoice(c), u=new SpeechSynthesisUtterance(text);
    if(v){ u.voice=v; u.lang=v.lang; } else u.lang=c.lang;
    u.rate = c.rate * (S.voiceRate||0.92);
    u.pitch = c.pitch * (!exact && c.g==='m' && v && !isMale(v) ? 0.8 : 1);
    speechSynthesis.speak(u);
  }catch(e){}
}
function hush(){ try{ if(canSpeak()) speechSynthesis.cancel(); }catch(e){} clearTimeout(COUNT.t); COUNT.on=false; }
const spoken = t => String(t).replace(/\s*\([^)]*\)/g,'').replace(/\b1 lb\b/g,'1 pound').replace(/\b1 oz\b/g,'1 ounce').replace(/–/g,' to ').replace(/½/g,'half').replace(/¼/g,'a quarter').replace(/°F \(220°C\)/,' degrees').replace(/\blb\b/g,'pounds').replace(/\bkg\b/g,'kilos').replace(/\boz\b/g,'ounces').replace(/\btbsp\b/g,'tablespoon').replace(/[“”"]/g,'');
function whoSpoken(){ return S.active==='both' ? S.people.map(p=>p.name).join(' and ') : person(S.active).name; }
function speakExercise(){
  if(!P || !S.speak) return;
  const c=coach(), ex=EXERCISES[P.s.list[P.i]];
  const lead = P.i===0 ? pick(c.start).replace('{who}',whoSpoken()).replace('{session}',P.s.title) : pick(c.next);
  const parts=[lead, ex.name+'.', spoken(ex.dose)+'.', ...ex.steps.map(spoken)];
  if(needsBreath(ex)) parts.push(c.breathe);
  if(ex.weighted && !ex.bodyweight) parts.push(whoIds().map(pid=>`${person(pid).name}: ${getW(pid,P.s.list[P.i])===0?'no weight':getW(pid,P.s.list[P.i])+' pounds'}`).join('. ')+'.');
  say(parts.join(' '));
}
/* Count reps aloud at a slow, controlled pace */
const COUNT={on:false,t:null};
function repTarget(ex){ const m=String(ex.dose).match(/(\d+)\s*(?:–|-|to)\s*(\d+)/); if(m) return Math.round((+m[1]+ +m[2])/2); const n=String(ex.dose).match(/\d+/g); if(!n) return 8; const nums=n.map(Number); return /rounds? of/.test(ex.dose)?nums[1]||nums[0]:nums[0]; }
function countReps(){
  const ex=EXERCISES[P.s.list[P.i]], c=coach(), n=Math.min(20,repTarget(ex)), pace = ex.cat==='strength'?4200:3200;
  hush(); COUNT.on=true; let i=0;
  const btn=()=>$('[data-act="count"]');
  if(btn()) btn().textContent='⏹ Stop counting';
  const step=()=>{ if(!COUNT.on||!P) return; i++;
    let line = String(i);
    if(i===1 && needsBreath(ex)) line = '1. '+c.breathe;
    if(i===Math.ceil(n/2) && n>=6) line = i+'. '+c.half;
    if(i>=n){ say(i+'. '+c.round, {force:true}); COUNT.on=false; if(btn()) btn().textContent='🔢 Count with me'; return; }
    say(line, {force:true}); COUNT.t=setTimeout(step, pace); };
  say(`Counting ${n}. Ready.`, {force:true}); COUNT.t=setTimeout(step, 2200);
}

let P=null, TIMER=null;
function startSession(key){

function stopTimer(){ clearInterval(TIMER); TIMER=null; if(P) P.running=false; }

const fmt = s => s==null?'':(Math.floor(s/60)+':'+pad(s%60));
function bindPlayer(){
  const o=$('#overlay');
  o.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{ const [pid,ex,d]=b.dataset.w.split(':'); setW(pid,ex,stepW(getW(pid,ex),+d)); const y=$('.player').scrollTop; drawPlayer(); $('.player').scrollTop=y; });
  o.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{
    const a=b.dataset.act;
    if(a==='close'){ hush(); if(P.i===0) closePlayer(); else ask('Stop this session? It won’t be counted.','Yes, stop',closePlayer); }
    if(a==='next'||a==='skip'){ hush(); stopTimer(); P.i++; P.left=null; drawPlayer(); }
    if(a==='back'){ hush(); stopTimer(); P.i=Math.max(0,P.i-1); P.left=null; P.spoken=null; drawPlayer(); }
    if(a==='speak'){ S.speak=!S.speak; save(); if(S.speak){ P.spoken=null; } else hush(); const y=$('.player').scrollTop; drawPlayer(); $('.player').scrollTop=y; }
    if(a==='repeat'){ speakExercise(); }
    if(a==='count'){ if(COUNT.on){ hush(); b.textContent='🔢 Count with me'; } else countReps(); }
    if(a==='timer'){
      unlockAudio();
      if(P.running){ stopTimer(); drawPlayer(); return; }
      if(P.left<=0) P.left = EXERCISES[P.s.list[P.i]].timer;
      P.running=true; b.textContent='⏸ Pause'; say(coach().go);
      const full=EXERCISES[P.s.list[P.i]].timer;
      TIMER=setInterval(()=>{ P.left--; const t=$('#tm'); if(t) t.textContent=fmt(Math.max(0,P.left));

function weekBars(id, weeks){
  const max = Math.max(4, ...weeks.map(w=>weekCounts(id,w).L.length));
  return `<div style="display:flex;gap:8px;align-items:flex-end;height:110px">${weeks.map(w=>{ const c=weekCounts(id,w); const h=Math.round((c.L.length/max)*80); const met=goalsMet(id,w);
    return `<div style="flex:1;text-align:center"><div class="small" style="font-weight:900">${met?'⭐':c.L.length||''}</div><div style="height:${Math.max(4,h)}px;background:${met?'var(--sun)':'var(--coral)'};border-radius:8px 8px 4px 4px;opacity:${c.L.length?1:.25}"></div><div class="small muted" style="font-size:.65rem">${w.getMonth()+1}/${w.getDate()}</div></div>`; }).join('')}</div>`;
}
function lineChart(T){
  const W=520,H=120,pd=24; const vals=T.map(t=>t.value); const mn=Math.min(...vals), mx=Math.max(...vals); const rng=(mx-mn)||1;
  const pts=T.map((t,i)=>[pd+(i*(W-2*pd))/Math.max(1,T.length-1), H-pd-((t.value-mn)/rng)*(H-2*pd)]);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Trend">
    <polyline fill="none" stroke="var(--coral)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(p=>p.join(',')).join(' ')}"/>
    ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="6" fill="var(--card)" stroke="var(--coral)" stroke-width="3"/><text x="${p[0]}" y="${p[1]-11}" text-anchor="middle" font-size="15" font-weight="800" fill="var(--ink)">${T[i].value}</text>`).join('')}
  </svg>`;
}

/* --- check-in flows --- */
function testFlow(kind){
  unlockAudio(); keepAwake(true);
  const ids = whoIds();
  let idx=0;
  const next = () => { if(idx>=ids.length){ closeOverlay(); const fresh=checkBadges(); render(); confetti(); toast('Check-in saved! ⭐'); queueBadges(fresh); return; } runTest(kind, person(ids[idx]), v=>{ if(v!=null) S.tests.push({date:today(), who:ids[idx], kind, value:v}); save(); idx++; next(); }); };
  next();
}
function closeOverlay(){ hush(); keepAwake(false); stopTimer(); $('#overlay').innerHTML=''; document.body.style.overflow=''; setTimeout(flushBadges,300); }
function runTest(kind, p, done){
  document.body.style.overflow='hidden';
  const shell = inner => { $('#overlay').innerHTML = `<div class="player"><div class="wrap"><div class="row" style="align-items:center"><div style="font-weight:900">${avatar(p)} ${esc(p.name)}’s check-in</div><button class="btn ghost" style="flex:0 0 auto;width:auto;min-height:52px;padding:8px 16px;font-size:.9rem" id="tx">✕ Close</button></div>${inner}</div></div>`; $('#tx').onclick=()=>{ closeOverlay(); render(); }; };
  if(kind==='chair'){
    let count=0, left=30, started=false;
    shell(`<h1 style="margin-top:16px">30-second chair stand 🪑</h1>
      <ol class="steps"><li>Chair against a wall. Sit in the middle, feet flat.</li><li>Cross your arms over your chest.</li><li>A helper taps the big button each time ${esc(p.name)} stands all the way up.</li></ol>

      shell(`<div style="text-align:center"><div class="bigemoji">🎉</div><h1>${count} stands!</h1>

        <button class="btn" id="ok" style="margin-top:14px">Save ✓</button></div>`);

    $('#ukg').onclick=()=>setU('kg'); $('#ulb').onclick=()=>setU('lb');
    $('#sk').onclick=()=>done(null);

  } else {

      <ol class="steps"><li>Stand facing the kitchen counter, hands hovering just above it.</li><li>Lift one foot and press Start.</li><li>Press Stop the moment you touch the counter or put your foot down. Stop at 30 seconds.</li></ol>

      <button class="btn ghost" id="sk" style="margin-top:12px">Skip ${esc(p.name)}</button>`);
    $('#sk').onclick=()=>{ stopTimer(); done(null); };
    $('#bb').onclick=()=>{
      if(!TIMER){ sec=0; $('#bb').textContent='Stop'; beep(); TIMER=setInterval(()=>{ sec++; $('#bt').textContent=sec; if(sec>=30){ stopTimer(); beep(); buzz(); end(); } },1000); }
      else { stopTimer(); end(); }

  }
}

   <button class="btn ghost" id="reset" style="margin-top:24px;color:#b91c1c">Start over (erase everything)</button>
  </div></div>`;
  const commit=()=>{ S.people.forEach((p,i)=>{ p.name=$('#pn'+i).value.trim()||p.name; p.age=parseInt($('#pa'+i).value,10)||p.age; p.emoji=$('#pe'+i).value.trim(); const ft=parseFloat($('#pft'+i).value), inch=parseFloat($('#pin'+i).value)||0; if(ft>0) p.heightIn=ft*12+inch; const w=parseFloat($('#pw'+i).value); if(w>0) p.weightLb=w; }); save(); };
  $('#sx').onclick=()=>{ commit(); closeOverlay(); render(); };
  $('#overlay').querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{ const k=b.dataset.g; S.goals[k]=Math.max(0,Math.min(7,S.goals[k]+Number(b.dataset.d))); $('#g-'+k).textContent=S.goals[k]; save(); });
  $('#overlay').querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{ commit(); S.theme=b.dataset.theme; save(); render(); openSettings(); });
  $('#overlay').querySelectorAll('[data-pt]').forEach(b=>b.onclick=()=>{ commit(); const [i,k]=b.dataset.pt.split(':'); S.people[+i].theme=k; save(); render(); openSettings(); });
  $('#overlay').querySelectorAll('[data-kitchen]').forEach(b=>b.onclick=()=>{ commit(); S.kitchen=b.dataset.kitchen==='on'; save(); render(); openSettings(); });
  $('#overlay').querySelectorAll('[data-hear]').forEach(b=>b.onclick=()=>{ const keep=S.voice; S.voice=b.dataset.hear; say(coach().sample,{force:true}); S.voice=keep; });
  $('#overlay').querySelectorAll('[data-coach]').forEach(b=>b.onclick=()=>{ commit(); S.voice=b.dataset.coach; save(); say(coach().sample,{force:true}); const y=$('.player').scrollTop; openSettings(); $('.player').scrollTop=y; });
  $('#overlay').querySelectorAll('[data-spk]').forEach(b=>b.onclick=()=>{ commit(); S.speak=b.dataset.spk==='on'; save(); const y=$('.player').scrollTop; openSettings(); $('.player').scrollTop=y; if(S.speak) say(coach().sample); });
  $('#overlay').querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>{ commit(); S.voiceRate=+b.dataset.rate; save(); const y=$('.player').scrollTop; openSettings(); $('.player').scrollTop=y; say(coach().sample,{force:true}); });
  $('#overlay').querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{ commit(); const p=S.people[+b.dataset.back]; p.backCare=!p.backCare; save(); const y=$('.player').scrollTop; openSettings(); $('.player').scrollTop=y; });
  $('#overlay').querySelectorAll('[data-pc]').forEach(b=>b.onclick=()=>{ commit(); const [i,j]=b.dataset.pc.split(':'); S.people[+i].color=+j; save(); render(); openSettings(); });
  $('#overlay').querySelectorAll('[data-contrast]').forEach(b=>b.onclick=()=>{ commit(); S.contrast=b.dataset.contrast==='high'; save(); render(); openSettings(); });
  $('#overlay').querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{ commit(); S.size=b.dataset.size; save(); render(); openSettings(); });
  $('#exp').onclick=async()=>{ commit();
    const name='strong-together-'+today()+'.json', json=JSON.stringify(S,null,1);
    try{ const file=new File([json],name,{type:'application/json'});
      if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:'Strong Together progress'}); return; } }
    catch(e){ if(e && e.name==='AbortError') return; }
    try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([json],{type:'application/json'})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); }catch(e){ showText(json); } };
  $('#imp').onchange=e=>{ const f=e.target.files[0]; if(!f) return; f.text().then(t=>{ try{ const d=JSON.parse(t); if(!d.people||!d.log) throw 0; const n=mergeIn(d); save(); closeOverlay(); render(); toast(n?`Added ${n} entries ✓`:'Already up to date ✓'); }catch(err){ toast('That file isn’t Strong Together progress'); } }); };
  $('#reset').onclick=()=>ask('Erase all progress on this device? This can’t be undone.','Erase',()=>{ S=structuredClone(DEFAULT); save(); closeOverlay(); render(); });
}

/* Combine another device's progress with this one (no duplicates). */
function mergeIn(d){
  const wasEmpty=!S.log.length && !S.tests.length;
  let n=0; const ids=new Set(S.log.map(l=>l.id));
  for(const l of d.log||[]) if(!ids.has(l.id)){ S.log.push(l); ids.add(l.id); n++; }
  const key=t=>[t.date,t.who,t.kind,t.value].join('|'); const tk=new Set(S.tests.map(key));
  for(const t of d.tests||[]) if(!tk.has(key(t))){ S.tests.push(t); tk.add(key(t)); n++; }
  S.log.sort((a,b)=>a.ts-b.ts); S.tests.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  for(const [pid,b] of Object.entries(d.seen||{})){ S.seen[pid]=Object.assign({}, b, S.seen[pid]||{}); }
  if(wasEmpty && d.people) S.people=d.people;
  return n;
}
/* ---------------- share ---------------- */
function shareWeek(){
  const lines=[`💪 Strong Together: week of ${weekStart().toLocaleDateString(undefined,{month:'short',day:'numeric'})}`];
  for(const p of S.people){ const c=weekCounts(p.id); lines.push(`${p.emoji?p.emoji+' ':''}${p.name}: walked ${c.walk}/${S.goals.walk} days · strength ${c.strength}/${S.goals.strength} · yoga ${c.stretch}/${S.goals.stretch} · grip & balance ${c.grip}/${S.goals.grip} · 🔥 ${streak(p.id)}-day streak${goalsMet(p.id)?' · ⭐ ALL GOALS HIT!':''}`); }
  const text=lines.join('\n');
  const copy=()=>{ if(navigator.clipboard){ navigator.clipboard.writeText(text).then(()=>toast('Copied! Paste it into a text message.'),()=>showText(text)); } else showText(text); };
  if(navigator.share){ navigator.share({text}).catch(e=>{ if(e&&e.name!=='AbortError') copy(); }); } else copy();
}

/* ---------------- confetti ---------------- */
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c=$('#confetti'), x=c.getContext('2d'); c.width=innerWidth; c.height=innerHeight;
  const cols=['#ff7a45','#ff4f8b','#7a5af8','#0f9d8a','#f5a524'];
  const ps=[...Array(120)].map(()=>({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,s:6+Math.random()*7,c:cols[Math.floor(Math.random()*5)],r:Math.random()*6}));
  let f=0; (function tick(){ x.clearRect(0,0,c.width,c.height); for(const p of ps){ p.vy+=.45; p.x+=p.vx; p.y+=p.vy; p.r+=.2; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c; x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); x.restore(); } if(++f<110) requestAnimationFrame(tick); else x.clearRect(0,0,c.width,c.height); })();
}

/* ---------------- events ---------------- */
function bind(root){
  root.querySelectorAll('[data-who]').forEach(b=>b.onclick=()=>{ S.active=b.dataset.who; save(); render(); });
  root.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>startSession(b.dataset.start));
  root.querySelectorAll('[data-walk]').forEach(b=>b.onclick=()=>{ addLog('walk',{minutes:Number(b.dataset.walk)}); render(); toast(`Walk logged for ${S.active==='both'?'both of you':person(S.active).name}! 🚶`); });
  root.querySelectorAll('[data-recipe]').forEach(b=>b.onclick=()=>openRecipe(+b.dataset.recipe));
  root.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{ LOGDAY=Number(b.dataset.day); render(); });
  root.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>{ const k=b.dataset.quick; addLog(k,{quick:true}); render(); toast(`${SESSIONS[k].title} ticked off for ${S.active==='both'?'both of you':person(S.active).name}! ✓`); });
  root.querySelectorAll('[data-act="welcomed"]').forEach(b=>b.onclick=()=>{ S.welcomed=true; save(); render(); });
  root.querySelectorAll('[data-act="hideinstall"]').forEach(b=>b.onclick=()=>{ S.installHidden=true; save(); render(); });
  root.querySelectorAll('[data-undo]').forEach(a=>a.onclick=e=>{ e.preventDefault(); undoToday(a.dataset.undo); });
  root.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{ LIBCAT=b.dataset.cat; render(); });
  root.querySelectorAll('[data-win]').forEach(b=>b.onclick=()=>{ const [pid,w]=b.dataset.win.split(':'); S.wins=S.wins||{}; S.wins[pid]=S.wins[pid]||{};
    if(S.wins[pid][w]){ ask('Untick this win?','Untick',()=>{ delete S.wins[pid][w]; save(); render(); }); return; }
    S.wins[pid][w]=today(); save(); const y=scrollY; render(); scrollTo(0,y); confetti(); toast(`${person(pid).name}: ${WINS.find(x=>x.id===w).t}! +25 points`); say(`Well done, ${person(pid).name}.`); });
  root.querySelectorAll('[data-test]').forEach(b=>b.onclick=()=>testFlow(b.dataset.test));
  root.querySelectorAll('[data-act="settings"]').forEach(b=>b.onclick=openSettings);
  root.querySelectorAll('[data-act="share"]').forEach(b=>b.onclick=shareWeek);
}
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{ TAB=b.dataset.tab; render(); });

load(); checkBadges(); render();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
